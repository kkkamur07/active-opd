[project]
name = "aopd"
version = "0.1.0"
description = "Hydra-configured active on-policy distillation prototype"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.5",
    "datasets>=3.0",
    "hydra-core>=1.3.2",
    # Answer equivalence. Without it the verifier falls back to a conservative
    # string comparator that reports "unverified" instead of guessing, which
    # shrinks the training pool rather than poisoning it.
    "math-verify>=0.5",
    "numpy>=1.26",
    "torch>=2.6",
    "transformers>=4.51,<6",
]

[project.optional-dependencies]
quantization = [
    "bitsandbytes>=0.45",
]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aopd", "scripts"]

[tool.hatch.build.targets.wheel.force-include]
"configs" = "configs"
