# Math-only corpus with a real ground-truth answer column.
# OpenThoughts-114k is deliberately not used: its default split has only
# system/conversations, is sorted by domain (the first ~21k records are
# competitive programming), and has no answer column to verify against.
preset: openr1
dataset_name: open-r1/OpenR1-Math-220k
config_name: default
split: train
streaming: true
shuffle_buffer: 10000
limit: null
