# GKDTrainer settings (trl.experimental.gkd, TRL 1.10.0). ADR 0001.
# Values verified against the installed 1.10.0 source (gkd_trainer.py /
# gkd_config.py / experimental/utils.py DataCollatorForChatML).

# --- OPD objective ---
beta: 1.0                # 1.0 hits the special-cased exact branch: pure
                         # reverse KL(pi_S || pi_T), mode-seeking, gradient
                         # through the student (gkd_trainer.py:281)
lmbda: 0.0               # per-step Bernoulli(p) of in-trainer generation;
                         # 0.0 -> always train on our provided trajectories
# No temperature key on purpose: GKDConfig.temperature is generation-only in
# 1.10.0 — compute_loss never forwards it, the divergence is always computed
# at T=1.0 (gkd_trainer.py:422-428). Exactly what we want.

# --- optimization (fresh trainer per round, checkpoint-to-checkpoint) ---
learning_rate: 2.0e-5    # full-finetune scale (tinker's 1e-4 is LoRA-scale)
lr_scheduler_type: constant
warmup_steps: 0          # warmup at the start of the WHOLE run (>= 1: steps;
                         # < 1: fraction of the schedule length, e.g. 0.05 ->
                         # 5 of total_training_steps 100)
total_training_steps: null   # int: ONE LR schedule over the whole run --
                         # every train-stage launch builds warmup+decay for
                         # this many steps and advances it by the launch's
                         # --global-step-offset (steps already taken; the
                         # driver passes it) before its first step; only the
                         # scheduler is advanced, never the optimizer. The
                         # launch fails if offset + pass steps > total. null:
                         # the schedule restarts every launch (old behaviour)
num_train_epochs: 1
per_device_train_batch_size: 8  # PER RANK; micro 16 OOMed on r1-correctness-8k step 90 (2026-09-02, 131 MiB free of 79.25 GiB) -> back to 8 x 2. Batch probe 2026-09-01 21:00 UTC with the fused GDN kernels at cap 8192 (kl50 pass-0 rows, diagnostics on): micro 16 peak 73,949 MiB, 42.6 s/step; micro 8 peak 56,885 MiB, 44.5 s/step -> largest micro under the 75,000 MiB rule. Pre-kernels kl50 value was 8 (71.5 GiB peak, ~99 s/step at micro 4). At cap 16384 only 2 fits (apod run: micro-4 59.2 GiB at 8192, superlinear); scripts/bucket_experiment.py sets 2 x 8 there.
gradient_accumulation_steps: 2   # 2 DDP ranks x 8 x 2 = effective batch 32 (2026-09-02; 16 x 1 OOMed). USER DECISION 2026-08-15: eff 32, raised from 16 for stability (smoke3 at 4 oscillated, smoke8k at 16 degraded gently). Top-4 arms: 512/32 = 16 steps/round; 136 prompts: 17.
effective_batch: 32              # ASSERTED by the train stage: world_size x
                                 # per_device x grad_accum must equal this, so
                                 # changing num_gpus without retuning accum
                                 # fails loudly instead of silently changing
                                 # the optimizer trajectory
max_grad_norm: 1.0
weight_decay: 0.0

# --- memory / precision ---
bf16: true
gradient_checkpointing: true
use_liger_kernel: true   # chunked LigerFusedLinearJSDLoss: the divergence is
                         # computed in ~1024-token chunks fused with lm_head,
                         # so the (seq x 248k-vocab) logit tensors never
                         # materialize — without this, one fp32 copy is
                         # ~7.6 GiB at 8192 tokens and train OOMs (smoke8k).
                         # beta==1 branch is the same reverse-KL line as TRL's
                         # eager path (verified liger 0.8.1 == trl 1.10.0);
                         # TRL sets weight_hard_loss=0, weight_soft_loss=1.
teacher_dtype: bfloat16  # becomes teacher_model_init_kwargs={"dtype": ...};
                         # the "dtype" key is MANDATORY once kwargs are passed
                         # (gkd_trainer.py:182-186 indexes it unconditionally)
max_length: 24576        # pre-tokenized rows bypass collator truncation, but
                         # set it anyway so the 1024 default can never bite.
                         # Raised with the 16384 sampling cap (prompt + 16384
                         # response must fit).

# --- bookkeeping ---
logging_steps: 1
save_strategy: "no"      # driver saves the checkpoint explicitly at round end
seed: ${seed}
train_gpu: 0             # fallback GPU when num_gpus == 1; with num_gpus > 1
                         # the driver launches torchrun DDP across all GPUs
                         # (student + frozen teacher replicated per rank)

# --- per-step diagnostics on the training batch (docs/decisions.md 2026-09-01)
# Logged with loss/grad_norm/lr into train/log_history.jsonl (and W&B):
# overlap_ratio_top16, overlap_adv_top16 (Rethinking OPD Eq. 6-7, exactly as
# scripts/oracle_kl.py), abs_entropy_gap (mean |H_S - H_T| per response
# token), response_tokens, cap_hit_frac. Computed in no_grad by a chunked
# lm_head pass over the SAME hidden states the Liger fused loss consumes;
# never touches the loss or the optimizer trajectory. Also every step, from
# the Adam state after the update: bf16_rounded_frac (+ per block), the
# fraction of parameter elements whose update is below half a bf16 ulp of
# the weight and so is lost (pure-bf16 training, no fp32 master weights).
diag_every: 1            # compute the three distribution diagnostics every N
                         # optimizer steps (tokens + cap-hit are always logged);
                         # 0 disables them
diag_chunk: 1024         # response positions per lm_head chunk (oracle_kl's
                         # POSITION_CHUNK): ~2.9 GiB fp32 transient at 248k
                         # vocab; halve it to halve the transient
