# Held-out OpenThoughts validation set (2026-11-13): the last 200 questions of
# the bank pool order, never trained on (apod.datasets.load "otval200"). Used
# ONLY to choose the learning rate and each arm's best checkpoint; MATH-500 is
# the reported benchmark.
dataset: otval200
num_problems: 200
num_samples: 4
intermediate_num_problems: 200
eval_seed_offset: 200000
max_new_tokens: 16384            # eval cap (rollouts/training stay at sampling.max_new_tokens)
