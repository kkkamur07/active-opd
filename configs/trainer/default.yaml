max_optimizer_steps: 1000
max_rounds: 40
gradient_accumulation_steps: ${precision.gradient_accumulation_steps}
micro_batch_size: ${precision.micro_batch_size}
max_micro_batch_tokens: ${precision.max_micro_batch_tokens}
master_weights: ${precision.master_weights}
output_dir: ${paths.run_dir}
learning_rate: ${optimizer.learning_rate}
weight_decay: ${optimizer.weight_decay}
