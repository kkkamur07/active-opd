# @package _global_
# 4B program, lever 4: WHICH QUESTIONS by correctness. 120 questions x 4
# rollouts per refresh from one bucket of the 4B bank (teacher label: 9B,
# 4 rollouts at 8k, from bank-8k; student label: base Qwen3.5-4B, labelled
# once), all 4 trained. Strict labels: C >= 3/4, W <= 1/4.
defaults:
  - p4b_base
  - _self_

run_name: p4b-correct-s1

driver:
  arms:
    t_right_s_wrong:
      question_source: bank_bucket:teacher_right_student_wrong
      selection: all_k
    both_right:
      question_source: bank_bucket:both_right
      selection: all_k
    both_wrong:
      question_source: bank_bucket:both_wrong
      selection: all_k
    mixed:
      question_source: bank_bucket:mixed
      selection: all_k

rollout:
  num_rollouts: 4
selection:
  k: 4
