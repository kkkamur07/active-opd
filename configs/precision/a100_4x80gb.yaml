# 4x A100 80GB node. The HF trainer path uses one GPU for the student and
# lets the teacher's device_map place it elsewhere; the extra GPUs pay off in
# generation (see docs/verl.md for serving rollouts through verl/vLLM).
# A 30k-token sequence through the chunked loss peaks well under 80GB, so the
# token cap allows one full-length trace or several shorter ones per micro
# batch.
compute_dtype: bfloat16
allow_tf32: true
micro_batch_size: 2
max_micro_batch_tokens: 32000   # batch * padded_length cap
gradient_accumulation_steps: 8
max_grad_norm: 1.0
activation_checkpointing: true
# fp32 master weights: bf16 storage rounds an lr=1e-5 Adam step to a no-op for
# ~85-90% of parameters. Compute still runs in bf16 under autocast.
master_weights: fp32
loss_chunk_size: 2048
