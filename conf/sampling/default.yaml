# Sampling used for BOTH rollouts and MATH-500 eval, all arms (ADR 0002/0003).
# Changing anything here mid-experiment invalidates every curve; the driver
# stamps these values into each round's manifest for exactly that reason.
temperature: 1.0
top_p: 0.95
top_k: 20
# 0.0 = OFF (deliberate): generation and entropy scoring then use the SAME
# distribution, which keeps the method genuinely on-policy and removes the
# length->entropy coupling a penalty introduces (see docs/smoke_report.md).
# The tradeoff is degenerate repetition risk; the smoke report measures it.
# To re-enable, set a value and fast_presence_penalty: true (the incremental
# processor in apod/models/presence_penalty.py, token-identical to native).
presence_penalty: 0.0
fast_presence_penalty: false
# Hard cap per trajectory. Cap-hit trajectories are kept for training and
# graded incorrect for reporting (ADR 0002).
# USER DECISION 2026-08-15: 8192 -> 16384 for the NEXT run (the apod run
# completed at 8192; its resolved_config is untouched). Motivated by the 24k
# diagnostic: only 9.4% of traces finish under 8192, finished median 16,282.
# Implications not yet measured at 16384: train activation memory roughly
# doubles per sequence (micro-batch 4 at 8192 peaked 59.2/80 GiB -- expect to
# drop micro-batch back to 2), and rollout/eval wall time grows with length.
max_new_tokens: 16384
