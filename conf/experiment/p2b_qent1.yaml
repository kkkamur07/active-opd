# @package _global_
# 2B program, lever 3c (USER 2026-11-16): question entropy from ONE rollout.
# Same as p2b_qent (360 questions x 4 rollouts per refresh; keep the top third of
# questions, 120, with all 4 rollouts = 480 trained per refresh), but each
# question's score = the entropy of its rollout_index-0 rollout only, not the
# mean over 4. Rollouts are i.i.d. given the question, so this trains on exactly
# what "1 rollout to score, then sample 3 more for the chosen questions" would.
# Offline (p2b-qent-s1 logs): a single rollout's top third shares 96-107 of 120
# questions with the 4-rollout mean's. One arm (qent1_high); compare with
# qent_high and random of the same seed.
#
# Paired with p2b-qkl-sN / p2b-qent-sN: same seed and driver.question_offset ->
# the same questions; step 0 reused from p2b-qkl-sN via driver.step0_rollouts_from.
defaults:
  - p2b_base
  - _self_

run_name: p2b-qent1-s1

driver:
  question_oversample: 3
  step0_rollouts_from: [outputs/runs/p2b-qkl-s1]
  arms:
    qent1_high:
      question_source: bank_labelled
      selection: qent1_high

rollout:
  num_rollouts: 4
selection:
  k: 4
