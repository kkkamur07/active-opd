# @package _global_
# Shared regime of the 2B selection program (USER 2026-11-14: switch from the 4B
# student to the 2B; the 4B-vs-9B gap at 8k was only 4.0 pts strict avg@4).
# Same design as p4b_base (60 steps = 4 refreshes x 15, eval cap 8192, score_all,
# keep_all_weights), with: student Qwen3.5-2B; LR 3.1623e-6 (the 2B r1-r4 LR,
# USER 2026-11-14); micro 8 x accum 2 (2B batch probe 2026-09-01: 56,885 MiB);
# one bank for every arm: bank-8k (9B teacher labels + base-2B student labels).
defaults:
  - p4b_base
  - _self_

model:
  student_id: Qwen/Qwen3.5-2B

driver:
  bank_dir: outputs/runs/bank-8k
  step0_eval_from: outputs/runs/p2b-rollout-s1/arms/random/rounds/round_00/eval   # base-2B MATH-500 @8k, made by the rollout group's first arm
  step0_rollouts_from: null

train:
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 2
  learning_rate: 3.1623e-06

engine:
  target_concurrent_sequences: 384   # 2B: 4.82M KV tokens/GPU; 224 seqs peaked at ~30% KV (2026-11-14 step-0 session)
