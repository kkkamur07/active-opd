# @package _global_
# 4B program, levers 1+2: WHICH ROLLOUTS. 120 questions x 12 rollouts per
# refresh, keep 4 per question. All five arms share the step-0 pool (same
# base model, same questions): the first arm generates and scores it
# (entropy + exact reverse KL), the others reuse it, so step 0 is paired.
#   random    4 random of 12 (the baseline, shared with every lever)
#   kl_*      reverse-KL ranks 1-4 / 5-8 / 9-12 (divergent / aligned / redundant)
#   ent_top4  4 highest student entropy (classic uncertainty sampling)
defaults:
  - p4b_base
  - _self_

run_name: p4b-rollout-s1

driver:
  bank_dir: outputs/runs/bank-8k   # teacher labels only (bank_labelled): identical in the 2B bank; correctness arms use bank-8k-4b
  step0_rollouts_from: [outputs/runs/p4b-lr]   # the LR sweep generated this exact step-0 pool
  arms:
    random:
      question_source: bank_labelled
      selection: random_k
    kl_mid:
      question_source: bank_labelled
      selection: kl_mid
    kl_high:
      question_source: bank_labelled
      selection: kl_high
    kl_low:
      question_source: bank_labelled
      selection: kl_low
    ent_top4:
      question_source: bank_labelled
      selection: entropy_top_k

rollout:
  num_rollouts: 12
selection:
  k: 4
