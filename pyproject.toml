[project]
name = "aopd"
version = "0.1.0"
description = "Active on-policy distillation experiment: Qwen3.5 student/teacher on OpenThoughts math"
readme = "README.md"
# vLLM supports >=3.10,<3.15; TRL supports >=3.10. See docs/guide.md.
requires-python = ">=3.12,<3.15"
dependencies = [
    "accelerate>=1.4.0",     # TRL 1.10.0 floor
    "datasets>=4.7.0",       # TRL 1.10.0 floor
    # Resolves to 1.4.0.dev*: stable 1.3.2 pins antlr4-python3-runtime==4.9.*,
    # which conflicts with math-verify[antlr4_13_2]. The 1.4 dev line drops the pin.
    "hydra-core>=1.3.2",     # experiment configuration; conf/ tree
    "liger-kernel>=0.8.1",
    "loguru>=0.7",
    "math-verify[antlr4_13_2]>=0.5.2",  # TRL math-verify extra floor
    "matplotlib>=3.11.1",
    "numpy>=1.26",
    "torch==2.11.0",         # exactly what vLLM 0.26.0 pins
    "tqdm>=4.66",
    "transformers>=5.5.3",   # vLLM 0.26.0 floor; Qwen3.5 needs >=5.2
]

[project.optional-dependencies]
# Rollout engine. 0.26.0 is a ceiling, not a preference: TRL 1.10.0 declares
# `vllm<=0.26.0`, so the current 0.27.1 would lock us out of trl[vllm] later.
# Qwen3.5 has been supported since vLLM 0.17, so nothing is lost.
vllm = ["vllm==0.26.0"]
# Later training phase; pulls the vllm extra at the same ceiling.
train = ["trl[vllm]==1.10.0"]
# Fused Triton kernels for Qwen3.5's Gated DeltaNet layers on the HF side
# (train, oracle scoring, entropy). transformers binds the `fla` package at
# import time when it is installed; pure-Python wheels, no nvcc, no torch or
# triton change (verified against the cu130 venv: only fla-core + this).
# NOT bitwise-neutral (bf16-level): fresh runs only. See docs/kernels.md.
kernels = ["flash-linear-attention==0.5.2"]

[project.scripts]
apod-lengths = "scripts.token_lengths:main"
apod-report = "scripts.rollout_report:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apod", "scripts"]

# cu130, because vLLM 0.26.0's PyPI wheel is a CUDA 13 build: it depends on
# nvidia-cutlass-dsl[cu13] and its _C_stable_libtorch extension links libcudart.so.13.
# A cu129 torch ships libcudart.so.12 instead, and `import vllm` then dies with
# "ImportError: libcudart.so.13: cannot open shared object file". Verified on this
# machine. The wheel decides the CUDA variant; the driver only sets a ceiling, and
# driver 595 clears the 580.65.06 floor for CUDA 13.x with room to spare.
# The earlier cu126 pin was justified by a driver 550.x that never existed here.
# Rationale and troubleshooting are in docs/guide.md.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }

[dependency-groups]
dev = [
    "optuna==4.9.0",
]
