# @package driver
# Step-based experiment driver (python -m apod.driver; ADR 0005/0006).
# The budget is counted in training steps (one optimizer update at
# train.effective_batch). Every refresh_every steps the driver evaluates the
# current weights, rolls out the next block of questions from them, scores and
# selects per the arm, trains refresh_every steps, checkpoints. Derived:
#   trajectories per refresh = refresh_every * train.effective_batch   (320)
#   questions per refresh    = trajectories per refresh / selection.k  (80)
#   refreshes                = steps_total / refresh_every             (10)
# The driver stamps rollout.num_prompts = questions per refresh into
# resolved_config.yaml for the rollout stage.
steps_total: 100
refresh_every: 10

# Arms, run sequentially, in this order. Each: a question source and a
# trajectory-selection rule (apod.selection.RULES). Experiment files fill it.
#   question_source: pool_random | bank_bucket:<bucket> | bank_top_entropy | bank_random
#   selection:       all_k | random_k | entropy_top_k | kl_high | kl_mid | kl_low
arms: {}

# Question bank (apod/bank.py output) for the bank_* question sources; one
# row per question with example_index, id, question, reference, bucket,
# question_entropy, and the student grades/truncation/lengths.
bank_path: outputs/runs/bank-8k/questions.jsonl

# Named eval sets run at every refresh beside cfg.eval (MATH-500): each is
# conf/eval/<name>.yaml, stamped into resolved_config.yaml as eval_sets.<name>
# and evaluated by rollout_eval --eval-only --eval-dataset <name>.
monitor_sets:
  - aime2526

# scripts/oracle_kl.py --estimator for the kl_* rules: exact (full-vocab
# reverse KL, the selection statistic of kl50) or mc (sampled-token estimate;
# validated offline, docs/perf_review.md finding 4).
kl_estimator: exact

# Shaded band (strict accuracy points, full width) drawn around every curve
# in plots/accuracy_vs_steps.png: the seed-replicate noise floor
# (docs/eval_benchmarks.md section 6: 4-7 point gaps at a fixed step).
noise_band_points: 5.0

# Replace every GPU stage with an in-process stub that writes the stage's
# files and done-markers, so the loop (step accounting, resume, dispatch,
# pruning, metrics, plot) runs on CPU in seconds. Never for a real run.
dry_run: false
