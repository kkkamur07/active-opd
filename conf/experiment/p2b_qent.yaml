# @package _global_
# 2B program, lever 3b (2026-11-15): WHICH QUESTIONS by the STUDENT'S OWN
# ENTROPY. Same design as p2b_qkl (360 questions x 4 rollouts per refresh; keep
# the high / middle / low third of questions, 120, with all 4 rollouts = 480
# trained per refresh), but each question's score = mean entropy-stage entropy
# of its rollouts instead of mean exact reverse KL: selection needs no teacher.
# Offline, question entropy ranks questions like question KL (Spearman 0.92-0.94,
# 101-109 of 120 top-third questions shared, chance 40, in all 8 qkl pools:
# experiments/p2b-analysis/qent_verify.txt); this run tests the training effect.
# score_all stays true (inherited): KL is logged on every rollout, so each
# refresh's overlap with what qkl_high would have picked is computable.
#
# Paired with p2b-qkl-sN: same seed and driver.question_offset -> the same
# questions. Step 0 (base model) rollouts + entropy + KL scores are reused from
# p2b-qkl-sN via driver.step0_rollouts_from (set per seed on the command line);
# from step 15 on, rollouts come from this run's own checkpoints.
# Arm order = run order: qent_high first (primary), then qent_low, then qent_mid.
defaults:
  - p2b_base
  - _self_

run_name: p2b-qent-s1

driver:
  question_oversample: 3
  step0_rollouts_from: [outputs/runs/p2b-qkl-s1]
  arms:
    qent_high:
      question_source: bank_labelled
      selection: qent_high
    qent_low:
      question_source: bank_labelled
      selection: qent_low
    qent_mid:
      question_source: bank_labelled
      selection: qent_mid

rollout:
  num_rollouts: 4
selection:
  k: 4
