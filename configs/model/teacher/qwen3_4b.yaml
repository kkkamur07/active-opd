# Frozen teacher, full bf16. The old 4-bit quantization and 22GiB memory cap
# were 24GB-card workarounds; quantized teacher logits are noisy distillation
# targets, and on 80GB cards the 8GB bf16 model needs neither. Pin the teacher
# off the training GPU on a multi-GPU node with e.g. device_map: "cuda:1".
model_id: Qwen/Qwen3-4B
revision: null
dtype: bfloat16
quantization: none
device_map: auto
max_memory: null
low_cpu_mem_usage: true
trust_remote_code: false
attn_implementation: sdpa
gradient_checkpointing: false
optimizer_8bit: false
use_cache: true
bnb_4bit_compute_dtype: bfloat16
bnb_4bit_quant_type: nf4
bnb_4bit_use_double_quant: true
