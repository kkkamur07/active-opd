# @package _global_
# 4B LR sweep (2026-11-13). The random arm (the shared baseline) at four peak
# LRs, 30 steps = the first two refreshes of the real 60-step schedule (warmup
# 3, cosine to 0.1x over 60: train.total_training_steps stays 60), judged on
# the held-out otval200 set (never MATH-500). All four arms share ONE step-0
# pool (identical base-model rollouts), so they differ only in the LR.
# Decision: the LR with the highest mean otval200 strict avg@4 over steps 15
# and 30; near-ties (< 1 point) go to the lower LR.
defaults:
  - p4b_base
  - override /eval: otval200
  - _self_

run_name: p4b-lr

driver:
  bank_dir: outputs/runs/bank-8k   # teacher labels only (bank_labelled): identical in the 2B bank; correctness arms use bank-8k-4b
  steps_total: 30
  step0_eval_from: null           # step 0 on otval200 runs once (first arm), then reused
  keep_all_weights: false
  score_all: false                # random_k needs no scores; p4b_rollout scores the shared pool once
  arms:
    lr_5e-6:
      question_source: bank_labelled
      selection: random_k
      learning_rate: 5.0e-06
    lr_1e-5:
      question_source: bank_labelled
      selection: random_k
      learning_rate: 1.0e-05
    lr_2e-6:
      question_source: bank_labelled
      selection: random_k
      learning_rate: 2.0e-06
    lr_2e-5:
      question_source: bank_labelled
      selection: random_k
      learning_rate: 2.0e-05

train:
  total_training_steps: 60

rollout:
  num_rollouts: 12
selection:
  k: 4
