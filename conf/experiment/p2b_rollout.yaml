# @package _global_
# 2B program, levers 1+2: WHICH ROLLOUTS. 120 questions x 12 rollouts per
# refresh, keep 4 per question. All five arms share the step-0 pool (same
# base model, same questions): the first arm (random) generates and scores it
# (entropy + exact reverse KL) and runs the base-2B MATH-500 eval; the others reuse both.
#   random    4 random of 12 (the baseline, shared with every lever)
#   kl_*      reverse-KL ranks 1-4 / 5-8 / 9-12 (divergent / aligned / redundant)
#   ent_top4  4 highest student entropy (classic uncertainty sampling)
defaults:
  - p2b_base
  - _self_

run_name: p2b-rollout-s1

driver:
  step0_eval_from: null          # this group makes the base-2B eval; p2b_qkl / p2b_correct reuse it
  arms:
    random:
      question_source: bank_labelled
      selection: random_k
    kl_mid:
      question_source: bank_labelled
      selection: kl_mid
    kl_high:
      question_source: bank_labelled
      selection: kl_high
    kl_low:
      question_source: bank_labelled
      selection: kl_low
    ent_top4:
      question_source: bank_labelled
      selection: entropy_top_k

rollout:
  num_rollouts: 12
selection:
  k: 4
