# @package _global_
# Shared regime of the 4B selection program (outputs/apod-experiment-program.md,
# 2026-11-13). Not runnable alone (no arms); the p4b_* experiment files add arms.
#
# Student Qwen3.5-4B, teacher Qwen3.5-9B, bf16. Rollouts and training at cap
# 8192; MATH-500 eval at 16384. 60 training steps = 4 refreshes x 15 steps at
# effective batch 32 (480 trained rollouts per refresh); a final eval at step 60.
# One question pool for every arm: the teacher-labelled questions of the 4B
# bank (bank-8k-4b: 9B teacher labels of bank-8k + base-4B student labels).
defaults:
  - override /eval: math500_16k
  - _self_

model:
  student_id: Qwen/Qwen3.5-4B

driver:
  steps_total: 60
  refresh_every: 15
  monitor_sets: []               # AIME later, on the saved checkpoints
  bank_dir: outputs/runs/bank-8k-4b
  score_all: true                # entropy + exact reverse KL on EVERY rollout of every arm
  keep_all_weights: true         # every refresh checkpoint kept (AIME later, best-checkpoint choice)
  step0_eval_from: outputs/runs/p0-4b-base16k/arms/base/rounds/round_00/eval
  question_offset: 0             # fresh questions per seed: seed s uses a different offset

keep_checkpoints: 5

sampling:
  max_new_tokens: 8192
engine:
  max_model_len: 18432           # 16384 eval tokens + prompt
  gpu_memory_utilization: 0.92
  target_concurrent_sequences: 160   # vLLM max_num_seqs: 1.76M-token KV per GPU, ~9.1k tok in flight per seq at a 16k eval cap -> 160 avoids preemption thrash
  chunk_sequences: 1024          # requests per llm.generate call: no per-256 drain (rollout_eval.run_session)

train:
  max_length: 16384
  # micro-batch: set from the 4B memory probe (effective batch 32 = 2 ranks x micro x accum)
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 5.0e-06         # placeholder until the 4B LR sweep (p4b_lr) decides
  total_training_steps: ${driver.steps_total}
  warmup_steps: 3                # 5% of 60
  lr_scheduler_type: cosine_with_min_lr
  lr_scheduler_kwargs:
    min_lr_rate: 0.1
  persist_optimizer: true
